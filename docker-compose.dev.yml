version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: verso-postgres
    environment:
      POSTGRES_DB: versoair_business_intelligence
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # pgAdmin - Web Interface
  pgadmin:
    image: dpage/pgadmin4
    container_name: verso-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@versoair.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "8080:80"
    depends_on:
      - postgres
    restart: unless-stopped

  # Adminer - Lightweight DB Manager
  adminer:
    image: adminer
    container_name: verso-adminer
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data: