version: "3.8"

# ─── Production deployment notes ──────────────────────────────────────────────
# This file requires DB_USER, DB_PASSWORD, JWT_SECRET, SESSION_SECRET and
# CORS_ORIGIN to be set in the environment (e.g. a real `.env` file, not
# committed). There are intentionally NO insecure default fallbacks here —
# `docker compose -f docker-compose.prod.yml up` will fail fast with a clear
# "variable is not set" error instead of silently starting with weak secrets.

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: verso_air_db
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER must be set}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      POSTGRES_DB: ${DB_NAME:-versoair_business_intelligence}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-verso_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - verso_air_network

  # Backend API Server (serves the built client bundle too — see Dockerfile's
  # `production` stage / server/prod-static.ts. There is no separate frontend
  # container in production; a dev-mode frontend service here would collide
  # on the same port and ship an unbuilt, unoptimized client.)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: verso_air_api
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-5003}
      DATABASE_URL: postgresql://${DB_USER:?DB_USER must be set}:${DB_PASSWORD:?DB_PASSWORD must be set}@postgres:5432/${DB_NAME:-versoair_business_intelligence}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set to a random 64+ char hex value}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set to a random 64+ char hex value}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN must be set to the real production origin(s)}
    ports:
      - "${PORT:-5003}:5003"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - verso_air_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx Reverse Proxy (optional — TLS termination in front of `backend`).
  # Requires ./nginx.conf and certs under ./ssl to exist before enabling this
  # profile; see nginx.conf.example in this repo for a working starting point.
  nginx:
    image: nginx:alpine
    container_name: verso_air_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - verso_air_network
    profiles:
      - production

volumes:
  postgres_data:
    driver: local

networks:
  verso_air_network:
    driver: bridge
