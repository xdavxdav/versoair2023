databases:
  - name: versoair-db
    plan: free
    databaseName: versoair_business_intelligence
    user: versoair

services:
  - type: web
    name: versoair
    runtime: node
    plan: free
    healthCheckPath: /api/health
    # NOTE: Migrations are intentionally NOT run here. Running `db:migrate` on
    # every build makes schema changes an uncontrolled side effect of an
    # ordinary deploy (no review gate, no concurrency protection, no backup
    # step). Apply migrations as a separate, deliberate release step instead:
    #   1. Back up the production database.
    #   2. Run `npm run db:migrate` once, by hand or via a one-off Render job,
    #      against the target database, outside of the web build.
    #   3. Only then deploy the application code that depends on the new schema.
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: versoair-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: PRODUCTION_URL
        sync: false
      - key: APP_PUBLIC_URL
        sync: false
      - key: MAIN_APP_URL
        sync: false
      - key: VERSOAIR_URL
        sync: false
      - key: MUSIC_APP_URL
        sync: false
      - key: VITE_API_URL
        sync: false
