databases:
  - name: versoair-db
    plan: free
    databaseName: versoair_business_intelligence
    user: versoair

services:
  - type: web
    name: versoair
    runtime: node
    plan: free
    healthCheckPath: /api/health
    buildCommand: npm ci && npm run build
    # Migrations run as a separate, observable pre-deploy step (not part of the
    # ordinary build), so a failed/slow migration can't silently corrupt a build
    # artifact and Render guarantees only one pre-deploy command runs per deploy.
    # See VERSOAIR_MASTER_REMEDIATION_PLAN.md P0.3 for the full rationale and the
    # follow-up recommendation to gate this behind manual release approval in CI.
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: versoair-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: PRODUCTION_URL
        sync: false
      - key: APP_PUBLIC_URL
        sync: false
      - key: MAIN_APP_URL
        sync: false
      - key: VERSOAIR_URL
        sync: false
      - key: MUSIC_APP_URL
        sync: false
      - key: VITE_API_URL
        sync: false
