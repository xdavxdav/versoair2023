services:
  app:
    build: .
    container_name: verso_app
    ports:
      - "5002:5002" # Maps container port 5002 to host port 5002
    environment:
      - NODE_ENV=development
      # DATABASE_URL built from this file's own DB_PASSWORD below — do not
      # hardcode credentials here.
      - DATABASE_URL=postgresql://versoair:${DB_PASSWORD:?DB_PASSWORD must be set}@db:5432/versoair_business_intelligence
      # No hardcoded default — set SESSION_SECRET in your shell/.env before
      # running this file (e.g. `export SESSION_SECRET=$(openssl rand -hex 32)`).
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set}
      - PORT=5002
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - .:/app
    working_dir: /app
    command: npm run start
    networks:
      - verso-network

  db:
    image: postgres:15
    container_name: my_postgres_db
    environment:
      - POSTGRES_USER=versoair
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - POSTGRES_DB=versoair_business_intelligence
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U versoair"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - verso-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: verso_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@versoair.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD must be set}
    ports:
      - "8080:80"
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - verso-network

volumes:
  pgdata:

networks:
  verso-network:
    driver: bridge
